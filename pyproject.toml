[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "food-delivery-forecast"
version = "0.1.0"
description = "外卖订单量预测与调度优化系统"
authors = [
  { name="Team", email="team@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.3.0",
  "xgboost>=2.0.0",
  "lightgbm>=4.1.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "scipy>=1.11.0",
  "openpyxl>=3.1.0",
  "joblib>=1.3.0",
  "optuna>=3.4.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "black>=24.0",
  "isort>=5.12",
  "flake8>=6.0",
  "mypy>=1.0",
  "pre-commit>=3.0",
]
notebooks = [
  "jupyter>=1.0.0",
  "notebook>=7.0.0",
  "ipykernel>=6.26.0",
  "ipywidgets>=8.1.0",
]

[project.scripts]
food-delivery-forecast = "main:main"

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    | \.git
    | \.github
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | notebooks
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "data", "."]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src", "data"]
omit = [
  "*/tests/*",
  "*/scripts/*",
  "*/notebooks/*",
]
